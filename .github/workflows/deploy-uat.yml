name: Deploy UAT

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-uat:
    name: Build and Deploy UAT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create env file for UAT
        run: |
          echo "${{ secrets['NUXT_ENV_FILE_UAT'] }}" > .env.uat

      - name: Build (UAT)
        run: npm run build:uat

      - name: Setup Firebase service account (UAT)
        run: |
          echo "${{ secrets['FIREBASE_SERVICE_ACCOUNT_UAT'] }}" > "$RUNNER_TEMP/firebase-uat.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-uat.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase UAT
        run: npx firebase-tools deploy --project familyxp-uat --only hosting,firestore:rules,storage --non-interactive
